# SPDX-License-Identifier: GPL-3.0-or-later
# Manual workflow for building an unsigned release IPA in a personal fork.
# Automatically prepares the Darwin SDK from GitHub's macOS runner (no PC needed),
# or downloads it from secrets.DARWIN_SDK_URL if provided.
name: Build iPad IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-sdk:
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      from-secret: ${{ steps.check.outputs.from-secret }}
    steps:
      - name: Check if DARWIN_SDK_URL secret is set
        id: check
        env:
          HAS_URL: ${{ secrets.DARWIN_SDK_URL != '' }}
        run: echo "from-secret=$HAS_URL" >> "$GITHUB_OUTPUT"

      - name: Package Darwin SDK from preinstalled Xcode
        if: steps.check.outputs.from-secret != 'true'
        run: |
          set -euo pipefail
          DEV_DIR=$(ls -d /Applications/Xcode*.app/Contents/Developer | sort -V | tail -n1)
          echo "Using Xcode developer dir: $DEV_DIR"
          OUT=/tmp/darwin-sdk/Developer
          mkdir -p "$OUT/Platforms/iPhoneOS.platform/Developer/SDKs"
          mkdir -p "$OUT/Platforms/MacOSX.platform/Developer/SDKs"
          mkdir -p "$OUT/Toolchains/XcodeDefault.xctoolchain/usr/lib"

          IOS_SDK=$(realpath "$(ls -d "$DEV_DIR/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS"*.sdk | sort -V | tail -n1)")
          MAC_SDK=$(realpath "$(ls -d "$DEV_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX"*.sdk | sort -V | tail -n1)")
          echo "iOS SDK: $IOS_SDK"
          echo "macOS SDK: $MAC_SDK"

          cp -a "$IOS_SDK" "$OUT/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS26.5.sdk"
          cp -a "$MAC_SDK" "$OUT/Platforms/MacOSX.platform/Developer/SDKs/MacOSX26.5.sdk"
          cp -a "$DEV_DIR/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang" "$OUT/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang"

          tar -C /tmp/darwin-sdk -czf /tmp/darwin-sdk.tar.gz Developer

      - name: Upload temporary Darwin SDK artifact
        if: steps.check.outputs.from-secret != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: darwin-sdk-bundle
          path: /tmp/darwin-sdk.tar.gz
          retention-days: 1

  build-ipa:
    needs: prepare-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install host build dependencies and LLVM 22
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ make bison flex gettext cmake ninja-build meson \
            python3 python3-pefile python3-mako python3-yaml xxd openssl patch git rsync p7zip-full \
            curl xz-utils unzip libc6-dev lsb-release wget software-properties-common gnupg \
            autoconf automake libtool pkg-config liblzma-dev zlib1g-dev libssl-dev libsqlite3-dev \
            libcurl4-openssl-dev glslang-tools spirv-tools libdrm-dev libexpat1-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y --no-install-recommends \
            lld-22 lld-21 llvm-22 clang-22 llvm-22-dev libclang-22-dev
          sudo apt-get install -y --no-install-recommends libclc-22-dev || true
          sudo apt-get install -y --no-install-recommends libllvmspirvlib-22-dev llvm-spirv-22 || true
          for tool in clang clang++ lld llvm-ar llvm-ranlib llvm-nm llvm-objdump llvm-objcopy llvm-lipo llvm-strip llvm-readobj llvm-libtool-darwin; do
            if [ -x "/usr/bin/${tool}-22" ]; then
              sudo ln -sf "/usr/bin/${tool}-22" "/usr/bin/${tool}"
            fi
          done
          # lld-22 rejects platform macOS on MacOSX26.5.sdk; lld-21's ld64.lld works cleanly.
          sudo ln -sf /usr/lib/llvm-21/bin/ld64.lld /usr/bin/ld64.lld
          sudo ln -sf /usr/lib/llvm-21/bin/ld64.lld /usr/lib/llvm-22/bin/ld64.lld
          clang --version
          ld64.lld --version || true
          llvm-lipo --version || true

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Cache libimobiledevice (1.4+ for xtool)
        id: cache-imobile
        uses: actions/cache@v4
        with:
          path: /opt/libimobiledevice
          key: libimobiledevice-master-v1

      - name: Build libimobiledevice stack for xtool
        if: steps.cache-imobile.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/libimobiledevice
          sudo chown "$(id -u):$(id -g)" /opt/libimobiledevice
          export PKG_CONFIG_PATH="/opt/libimobiledevice/lib/pkgconfig"
          export LD_LIBRARY_PATH="/opt/libimobiledevice/lib"
          mkdir -p /tmp/imobile && cd /tmp/imobile
          for repo in libplist libimobiledevice-glue libtatsu libusbmuxd libimobiledevice; do
            git clone --depth 1 "https://github.com/libimobiledevice/${repo}.git"
            (
              cd "$repo"
              ./autogen.sh --prefix=/opt/libimobiledevice --without-cython
              make -j"$(nproc)"
              make install
            )
          done
          rm -rf /tmp/imobile

      - name: Cache llvm-mingw (with arm64ec CRT)
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: /tmp/llvm-mingw
          key: llvm-mingw-20260922-ucrt-arm64ec-v1

      - name: Install llvm-mingw and rebuild arm64ec CRT
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fSL -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz
          mkdir -p /tmp/llvm-mingw
          tar -xf /tmp/llvm-mingw.tar.xz --strip-components=1 -C /tmp/llvm-mingw
          rm -f /tmp/llvm-mingw.tar.xz

          export PATH="/tmp/llvm-mingw/bin:$PATH"
          MINGW_W64_VERSION="57b595039040eaa15bece85b7cc71d952281b269"
          git clone --filter=blob:none https://git.code.sf.net/p/mingw-w64/mingw-w64 /tmp/mingw-w64
          git -C /tmp/mingw-w64 checkout "$MINGW_W64_VERSION"
          mkdir -p /tmp/mingw-w64/mingw-w64-crt/build-aarch64
          cd /tmp/mingw-w64/mingw-w64-crt/build-aarch64
          ../configure --prefix=/tmp/llvm-mingw --host=aarch64-w64-mingw32 \
            --disable-lib32 --disable-lib64 --enable-libarm64 --enable-arm64x \
            --with-default-msvcrt=ucrt --enable-cfguard --enable-silent-rules
          make -j"$(nproc)"
          make install
          rm -rf /tmp/mingw-w64

          CRT_LIB="/tmp/llvm-mingw/aarch64-w64-mingw32/lib"
          BUILTIN=$(find /tmp/llvm-mingw/lib/clang -name "libclang_rt.builtins-aarch64.a" | head -n1)
          for f in libgcc.a libgcc_eh.a libgcc_s.a; do
            cp -f "$BUILTIN" "$CRT_LIB/$f"
          done

      - name: Cache .work/inputs and .work/cache
        uses: actions/cache@v4
        with:
          path: |
            .work/inputs
            .work/cache
          key: playport-inputs-cache-${{ hashFiles('pins.lock', 'build/toolchain/**') }}
          restore-keys: |
            playport-inputs-cache-

      - name: Download Darwin SDK from artifact
        if: ${{ needs.prepare-sdk.outputs.from-secret != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: darwin-sdk-bundle
          path: /tmp/darwin-sdk-archive

      - name: Extract Darwin SDK from artifact
        if: ${{ needs.prepare-sdk.outputs.from-secret != 'true' }}
        run: |
          mkdir -p /tmp/darwin-sdk
          tar -xzf /tmp/darwin-sdk-archive/darwin-sdk.tar.gz -C /tmp/darwin-sdk
          rm -rf /tmp/darwin-sdk-archive

      - name: Download Darwin SDK from secret URL
        if: ${{ needs.prepare-sdk.outputs.from-secret == 'true' }}
        env:
          DARWIN_SDK_URL: ${{ secrets.DARWIN_SDK_URL }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/darwin-sdk
          curl -fSL -o /tmp/darwin-sdk-archive "$DARWIN_SDK_URL"
          case "$DARWIN_SDK_URL" in
            *.zip*) unzip -q /tmp/darwin-sdk-archive -d /tmp/darwin-sdk ;;
            *) tar -xf /tmp/darwin-sdk-archive -C /tmp/darwin-sdk ;;
          esac
          rm -f /tmp/darwin-sdk-archive

      - name: Setup and build unsigned release IPA
        env:
          PKG_CONFIG_PATH: /opt/libimobiledevice/lib/pkgconfig
          LD_LIBRARY_PATH: /opt/libimobiledevice/lib
          CPATH: /opt/libimobiledevice/include
          LIBRARY_PATH: /opt/libimobiledevice/lib
        run: |
          set -euo pipefail
          SDK_DIR=$(find /tmp/darwin-sdk -maxdepth 2 -name "Developer" -exec dirname {} \; | head -n1)
          echo "Using DARWIN_SDK=$SDK_DIR"
          # Put our LLVM 22 clang + lld-21 ld64.lld ahead of setup-swift's bundled clang/lld on PATH.
          mkdir -p /tmp/llvm-bin
          for tool in clang clang++ lld llvm-ar llvm-ranlib llvm-nm llvm-objdump llvm-objcopy llvm-lipo llvm-strip llvm-readobj llvm-libtool-darwin; do
            if [ -x "/usr/bin/${tool}-22" ]; then
              ln -sf "/usr/bin/${tool}-22" "/tmp/llvm-bin/${tool}"
            fi
          done
          ln -sf /usr/lib/llvm-21/bin/ld64.lld /tmp/llvm-bin/ld64.lld
          export PATH="/tmp/llvm-bin:$PATH"
          which clang ld64.lld swift
          echo 'int main(void){return 0;}' > /tmp/t.c
          clang --target=aarch64-apple-darwin -isysroot "$SDK_DIR/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX26.5.sdk" -fuse-ld=lld /tmp/t.c -o /tmp/t
          rm -f /tmp/t.c /tmp/t
          ./pp setup --llvm-mingw /tmp/llvm-mingw --darwin-sdk "$SDK_DIR" || true
          JOBS=$(nproc) ./pp build --variant release --unsigned

      - name: Dump stage logs on failure
        if: failure()
        run: |
          if [ -f .work/run/unix/wine/build-macos/config.log ]; then
            echo "=== build-macos/config.log (compiler check) ==="
            grep -A 30 "checking whether the C compiler works" .work/run/unix/wine/build-macos/config.log || true
          fi
          for f in .work/run/logs/*.log; do
            [ -f "$f" ] || continue
            echo "=== $f (last 60 lines) ==="
            tail -n 60 "$f" || true
          done

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: playport-ipad-unsigned-ipa
          path: .work/out/*/Playport-*-release-unsigned-*.ipa
          if-no-files-found: error
